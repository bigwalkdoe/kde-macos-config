# spectre-kde-config -- applied fontconfig settings
# Generated by apply.sh; tracked for verification.
# Excludes Inter web/woff-hinted subsets which are known fontconfig cache-corruption triggers.

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/Inter/web/*</glob>
      <glob>*/Inter/extras/woff-hinted/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>