# kde-macos-config -- applied Global Shortcuts
# Generated by apply.sh; tracked for verification.
# Uses kglobalaccel format; applied via kwriteconfig6.

[Global Shortcuts]
# Meta+Space = Application Launcher (Kickoff)
Meta+Space=org.kde.krunner,activate

# Meta+Enter = Terminal (Konsole)
Meta+Return=org.kde.konsole,activate

# Meta+E = File Manager (Dolphin)
Meta+E=org.kde.dolphin,activate

# Meta+W = Close Window
Meta+W=org.kde.kwin,close

# Meta+Q = Quit Application
Meta+Q=org.kde.kwin,close

# Meta+Left/Right = Move Window to Left/Right Half
Meta+Left=org.kde.kwin,quicktile-left
Meta+Right=org.kde.kwin,quicktile-right

# Meta+Up = Maximize Window
Meta+Up=org.kde.kwin,maximize

# Meta+Down = Minimize Window
Meta+Down=org.kde.kwin,minimize

# Meta+F = Fullscreen
Meta+F=org.kde.kwin,fullscreen

# Meta+Tab = Switch Windows (Alt+Tab style)
Meta+Tab=org.kde.kwin,walk-through-windows

# Meta+Shift+Tab = Switch Windows Reverse
Meta+Shift+Tab=org.kde.kwin,walk-through-windows-reverse

# Meta+1..4 = Switch to Virtual Desktop 1..4
Meta+1=org.kde.kwin,switch-to-desktop-1
Meta+2=org.kde.kwin,switch-to-desktop-2
Meta+3=org.kde.kwin,switch-to-desktop-3
Meta+4=org.kde.kwin,switch-to-desktop-4

# Meta+Shift+1..4 = Move Window to Desktop 1..4
Meta+Shift+1=org.kde.kwin,move-to-desktop-1
Meta+Shift+2=org.kde.kwin,move-to-desktop-2
Meta+Shift+3=org.kde.kwin,move-to-desktop-3
Meta+Shift+4=org.kde.kwin,move-to-desktop-4

# Meta+Shift+Q = Logout
Meta+Shift+Q=org.kde.ksmserver,logout

# Meta+L = Lock Screen
Meta+L=org.kde.ksmserver,lock

# Print = Spectacle (Screenshot)
Print=org.kde.spectacle,capture-area
Shift+Print=org.kde.spectacle,capture-fullscreen
Meta+Print=org.kde.spectacle,capture-window

# Media Keys (handled by MPRIS)
XF86AudioPlay=org.kde.plasma.mediacontroller,play-pause
XF86AudioNext=org.kde.plasma.mediacontroller,next
XF86AudioPrev=org.kde.plasma.mediacontroller,previous
XF86AudioStop=org.kde.plasma.mediacontroller,stop
XF86AudioMute=org.kde.plasma.volume,mute
XF86AudioLowerVolume=org.kde.plasma.volume,decrease
XF86AudioRaiseVolume=org.kde.plasma.volume,increase
XF86MonBrightnessDown=org.kde.plasma.brightness,decrease
XF86MonBrightnessUp=org.kde.plasma.brightness,increase