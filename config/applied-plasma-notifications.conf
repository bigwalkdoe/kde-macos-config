# spectre-kde-config -- applied Notification settings
# Generated by apply.sh; tracked for verification.
# macOS-like: banner style, no sounds, grouped by app.

[GlobalSettings]
# Show notifications in banner style (not popup)
UseBannerNotifications=true
# Don't play sounds
PlaySounds=false
# Show in history
ShowInHistory=true
# Max notifications in history
MaxHistoryCount=100
# Timeout for banner (ms)
BannerTimeout=5000
# Position: 0=top-right, 1=top-left, 2=bottom-right, 3=bottom-left
BannerPosition=0
# Group by application
GroupByApp=true
# Sort: 0=most recent first, 1=oldest first
SortOrder=0
# Don't show notifications during screen sharing/presenting
DoNotDisturb=false
# Auto-enable Do Not Disturb when presenting
AutoDoNotDisturbOnPresent=true
# Auto-enable Do Not Disturb when screen is locked
AutoDoNotDisturbOnLock=true

[Notifications]
# Default for all apps unless overridden
eventLogEnabled=true
showInHistory=true
showInPopup=true
showAsBanner=true
playSound=false
markAsReadOnTimeout=true