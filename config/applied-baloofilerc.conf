# kde-macos-config -- applied Baloo file indexing settings
# Generated by apply.sh; tracked for verification.
# Conservative defaults: index only local files, exclude common noise.

[General]
# Only index local files (not network shares)
onlyIndexLocalFiles=true

# Exclude patterns (glob syntax)
excludeFilters=*~,\#*\#,*.tmp,*.temp,*.o,*.lo,*.la,*.al,.libs,*.so,*.so.[0-9]*,*.a,[mM]akefile,*.orig,*.rej,*.bak,*bak,*.swp,*.swo,*.tmp,*.cache,*.lock,.git,.hg,.svn,.bzr,CVS,__pycache__,*.pyc,*.pyo,*.class,*.jar,*.war,*.ear,node_modules,.npm,.yarn,bower_components,target,.gradle,.maven,dist,build,out,bin,obj,.vs,.idea,.vscode,*.swp,*.swo,*~,*.bak,*.orig,*.rej,*.log,*.cache,*.lock

# Exclude folders (full paths)
excludeFolders=$HOME/.cache,$HOME/.local/share/Trash,$HOME/Downloads,$HOME/.local/share/Steam,$HOME/.var/app,$HOME/.flatpak,$HOME/.config/google-chrome,$HOME/.config/chromium,$HOME/.config/BraveSoftware,$HOME/.config/Vivaldi,$HOME/.config/mozilla,$HOME/.thunderbird,$HOME/.mozilla,$HOME/VirtualBox VMs,$HOME/.local/share/virtualbox

# First run: index hidden files (dotfiles)
indexHidden=false

# Use inotify for live updates
useInotify=true

# Idle timeout before indexing (ms)
idleTimeout=60000

# Max file size to index content (bytes, 0 = no limit)
maxFileSize=104857600

# Basic indexing only (no content extraction for large files)
basicIndexingOnly=false