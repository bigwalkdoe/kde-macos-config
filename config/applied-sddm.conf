# spectre-kde-config -- applied SDDM (login screen) configuration
# Generated by apply.sh; tracked for verification.
# Enterprise-grade: security, accessibility, branding, session management.

[Theme]
Current=Orchis-Mac
CursorTheme=Bibata-Modern-Ice
Font=Inter,10,-1,5,50,0,0,0,0,0

# Disable automatic login for security (enterprise requirement)
[Autologin]
User=
Session=

# Session management
[General]
# Disable user list for privacy (enterprise: show username field only)
# 0 = show user list, 1 = hide user list
HideUserList=0
# Show password prompt immediately (not after username)
# 0 = ask for username first, 1 = ask for password immediately
InputMethod=qtvirtualkeyboard
# Numlock on by default for password entry
Numlock=on
# Default session (empty = last used)
DefaultSession=plasma

# Security: failed login tracking
[Security]
# Enable failed login logging
LogFailedLogins=true
# Lock after N failed attempts (0 = disabled)
MaxFailedAttempts=5
# Lockout duration in seconds
LockoutDuration=300

# Accessibility
[Accessibility]
# High contrast mode support
HighContrast=false
# Large text scaling
LargeText=false
# Screen reader support
ScreenReader=false

# Branding (custom logo, background)
[Branding]
# Custom background image (empty = use theme default)
Background=
# Custom logo (empty = use theme default)
Logo=
# Show hostname
ShowHostname=false
# Show system info
ShowSystemInfo=false

# Keyboard layout
[Keyboard]
# Show keyboard layout indicator
ShowLayoutIndicator=true
# Default layout (empty = system default)
DefaultLayout=

# Users
[Users]
# Minimum UID to show in user list (hide system accounts)
MinimumUid=1000
# Maximum UID to show
MaximumUid=60000
# Hide users matching these patterns (comma-separated)
HiddenUsers=guest,test,demo
# Hide users with these shells
HiddenShells=/usr/sbin/nologin,/bin/false

# Wayland/Session
[Wayland]
# Enable Wayland session by default
EnableHiDPI=true
# Force Wayland (0 = auto, 1 = force, -1 = disable)
ForceWayland=0