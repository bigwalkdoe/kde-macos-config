# kde-macos-config -- applied Power Management settings
# Generated by apply.sh; tracked for verification.
# macOS-like: aggressive sleep on battery, prevent sleep when plugged in with lid closed.

[AC][DimDisplay]
idleTime=300000
times=1

[AC][DPMSControl]
idleTime=600000

[AC][HandleButtonEvents]
lidClose=0
lidCloseDocked=0
powerButton=2
suspendThenHibernate=false

[AC][SuspendSession]
idleTime=0
suspendThenHibernate=false

[AC][BrightnessControl]
value=100

[Battery][DimDisplay]
idleTime=60000
times=1

[Battery][DPMSControl]
idleTime=120000

[Battery][HandleButtonEvents]
lidClose=1
lidCloseDocked=1
powerButton=2
suspendThenHibernate=true

[Battery][SuspendSession]
idleTime=900000
suspendThenHibernate=true

[Battery][BrightnessControl]
value=70

[LowBattery][DimDisplay]
idleTime=30000
times=1

[LowBattery][DPMSControl]
idleTime=60000

[LowBattery][HandleButtonEvents]
lidClose=1
lidCloseDocked=1
powerButton=2
suspendThenHibernate=true

[LowBattery][SuspendSession]
idleTime=300000
suspendThenHibernate=true

[LowBattery][BrightnessControl]
value=40